<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Devo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#fff;--panel:#f6f6f9;--line:#e3e3ea;--text:#16161d;--mute:#6b6b7b;--acc:#6d5efc;--acc2:#2bb5ff;--code:#14141c;--codet:#e8e8f2;--user:#eeeafe}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e0e14;--panel:#15151e;--line:#26263a;--text:#ececf5;--mute:#8d8da3;--code:#07070b;--user:#221f3f;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0e0e14;--panel:#15151e;--line:#26263a;--text:#ececf5;--mute:#8d8da3;--code:#07070b;--user:#221f3f;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#fff;font:700 14px ui-monospace,monospace}
.right{display:flex;gap:8px;align-items:center}
.icon{background:none;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:7px 11px;cursor:pointer;font:inherit}
.icon:hover{background:var(--panel)}.icon.on{background:var(--acc);border-color:var(--acc);color:#fff}
.main{flex:1;display:flex;min-height:0}
aside{width:260px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px;gap:8px;overflow:auto}
.new{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;border-radius:10px;padding:10px;font:600 14px inherit;cursor:pointer}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute);margin:10px 4px 0}
.chat{padding:9px 10px;border-radius:9px;cursor:pointer;display:flex;justify-content:space-between;gap:6px;font-size:14px}
.chat span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chat:hover,.chat.on{background:var(--line)}
.chat b{color:var(--mute);font-weight:400;visibility:hidden}.chat:hover b{visibility:visible}
section{flex:1;display:flex;flex-direction:column;min-width:0}
#msgs{flex:1;overflow:auto;padding:24px 16px}.wrap{max-width:780px;margin:0 auto}
.hero{text-align:center;margin-top:8vh}.hero h1{font-size:30px;margin:8px 0 4px}.hero p{color:var(--mute);margin:0 0 22px}
.sugs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;text-align:left}
.sug{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px;cursor:pointer;font-size:14px}.sug:hover{border-color:var(--acc)}.sug small{display:block;color:var(--mute)}
.m{display:flex;gap:12px;margin-bottom:22px}
.av{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:700;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.body{min-width:0;flex:1;overflow-wrap:anywhere}.m.me{justify-content:flex-end}.m.me .av{display:none}.m.me .body{background:var(--user);padding:8px 14px;border-radius:14px;flex:0 1 auto}
.body p{margin:0 0 10px}.body ul,.body ol{margin:0 0 10px;padding-left:22px}
.body code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em;background:var(--panel);border:1px solid var(--line);padding:1px 5px;border-radius:5px}
pre{background:var(--code);border-radius:12px;margin:0 0 12px;overflow:hidden;border:1px solid var(--line)}
pre .bar{display:flex;justify-content:space-between;padding:6px 12px;font-size:12px;color:#9a9ab0;background:rgba(255,255,255,.05)}
pre .bar button{background:none;border:0;color:#9a9ab0;cursor:pointer;font:inherit}
pre code{display:block;background:none;border:0;padding:12px 14px;overflow-x:auto;color:var(--codet);font-size:13px;line-height:1.55;white-space:pre}
.k{color:#c792ea}.s{color:#a5e075}.c{color:#6c7086}.n{color:#f2b36b}.f{color:#6cb6ff}.dots{color:var(--mute)}
.more{margin:-8px 0 20px 42px}
footer{padding:10px 16px 14px}
.box{max-width:780px;margin:0 auto;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:8px 10px;display:flex;align-items:flex-end;gap:8px}
.box:focus-within{border-color:var(--acc)}
textarea{flex:1;border:0;background:none;color:var(--text);font:inherit;resize:none;outline:0;max-height:180px;padding:7px 4px}
.ib{border:0;background:none;color:var(--mute);width:36px;height:36px;border-radius:10px;cursor:not-allowed;font-size:18px;opacity:.5}
.send{border:0;background:var(--acc);color:#fff;width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:16px}
.hint{text-align:center;color:var(--mute);font-size:12px;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:9}.modal.on{display:grid}
.card{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(440px,92vw);max-height:90vh;overflow:auto}
.card h3{margin:0 0 14px}.row{margin-bottom:14px}.row label{display:block;font-size:13px;color:var(--mute);margin-bottom:5px}
select,input,.card textarea{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px;font:inherit}
.note{font-size:12px;color:var(--mute)}
@media(max-width:720px){aside{display:none}}
</style></head><body>
<header>
 <div class="logo"><div class="mark">Dv</div>Devo</div>
 <div class="right"><button class="icon" id="inf" title="Keep generating automatically when a reply is cut off">∞ Infinite</button><button class="icon" id="setBtn">⚙ Settings</button></div>
</header>
<div class="main">
 <aside><button class="new" id="newBtn">+ New chat</button><div class="lbl">Chats</div><div id="list"></div>
  <div class="lbl">Project folder</div><div class="chat" id="pfile"><span>📁 devo / 📄 prompt.txt</span></div></aside>
 <section>
  <div id="msgs"><div class="wrap" id="wrap"></div></div>
  <footer>
   <div class="box"><button class="ib" disabled title="Image upload coming soon">🖼</button>
    <textarea id="inp" rows="1" placeholder="Ask Devo anything about code: write, debug, design, review…"></textarea>
    <button class="send" id="send">➤</button></div>
   <div class="hint">Image upload coming soon · Enter to send, Shift+Enter for a new line</div>
  </footer>
 </section>
</div>
<div class="modal" id="pmodal"><div class="card"><h3>📄 prompt.txt</h3>
 <div class="row"><label>Devo follows this file in every chat. To change it, edit prompt.txt in your GitHub repo.</label><textarea id="pText" rows="8" readonly style="font-family:ui-monospace,monospace"></textarea></div>
 <button class="new" id="pClose" style="width:100%">Close</button></div></div>
<div class="modal" id="modal"><div class="card"><h3>Settings</h3>
 <div class="row"><label>Provider</label><select id="prov"><option value="anthropic">Anthropic (Claude)</option><option value="openai">OpenAI-compatible (OpenAI, Groq, OpenRouter…)</option></select></div>
 <div class="row"><label>API key</label><input id="key" type="password" placeholder="Paste your key" autocomplete="off"><div class="note">Stored only in this browser. Sent only to the provider you choose.</div></div>
 <div class="row"><label>Model</label><input id="model"></div>
 <div class="row" id="baseRow"><label>Base URL</label><input id="base"></div>
 <div class="row"><label>Focus</label><select id="focus"><option value="code">Writing & debugging code</option><option value="design">Architecture & design</option><option value="review">Code review & refactor</option></select></div>
 <div class="row"><label>Theme</label><select id="theme"><option value="auto">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div>
 <button class="new" id="close" style="width:100%">Done</button></div></div>
<script>
const $=id=>document.getElementById(id);
let chats=[],cur=null,busy=false,stop=false,PROMPT='';
let S={prov:'anthropic',key:'',model:'claude-sonnet-5-5',base:'https://api.openai.com/v1',focus:'code',theme:'auto',inf:false};
try{chats=JSON.parse(localStorage.getItem('dv_chats')||'[]');S=Object.assign(S,JSON.parse(localStorage.getItem('dv_set')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('dv_chats',JSON.stringify(chats.slice(0,40)));localStorage.setItem('dv_set',JSON.stringify(S))}catch(e){}};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function hl(c){return esc(c).replace(/(#.*$|\/\/.*$)|("""[\s\S]*?"""|'[^'\n]*'|"[^"\n]*"|`[^`\n]*`)|\b(def|class|import|from|return|if|elif|else|for|while|in|not|and|or|with|as|try|except|catch|finally|raise|throw|yield|async|await|lambda|None|null|True|False|true|false|pass|self|this|const|let|var|function|fn|func|struct|impl|public|private|static|void|int|new|export|package|use|match|switch|case)\b|\b(\d+\.?\d*)\b|\b([a-zA-Z_]\w*)(?=\()/gm,(m,a,b,c2,d,e)=>a?`<i class="c">${a}</i>`:b?`<i class="s">${b}</i>`:c2?`<i class="k">${c2}</i>`:d?`<i class="n">${d}</i>`:`<i class="f">${e}</i>`).replace(/<i class="(\w)">/g,'<span class="$1">').replace(/<\/i>/g,'</span>')}
function md(t){let h='';t.split(/```/).forEach((p,i)=>{
 if(i%2){const nl=p.indexOf('\n'),lang=(p.slice(0,nl)||'code').trim(),code=p.slice(nl+1).replace(/\n$/,'');
  h+=`<pre><div class="bar"><span>${esc(lang)}</span><button onclick="cp(this)">Copy</button></div><code>${hl(code)}</code></pre>`}
 else p.split(/\n{2,}/).forEach(b=>{b=b.trim();if(!b)return;const f=x=>esc(x).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'),L=b.split('\n');
  if(L.every(l=>/^\s*[-*] /.test(l)))h+='<ul>'+L.map(l=>'<li>'+f(l.replace(/^\s*[-*] /,''))+'</li>').join('')+'</ul>';
  else if(L.every(l=>/^\s*\d+\. /.test(l)))h+='<ol>'+L.map(l=>'<li>'+f(l.replace(/^\s*\d+\. /,''))+'</li>').join('')+'</ol>';
  else if(/^#{1,4} /.test(b))h+='<p><b>'+f(b.replace(/^#+ /,''))+'</b></p>';
  else h+='<p>'+f(b).replace(/\n/g,'<br>')+'</p>'})});return h}
function cp(b){navigator.clipboard&&navigator.clipboard.writeText(b.closest('pre').querySelector('code').innerText);b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1200)}
const SUG=[['Build a REST API','in Python, Node or Go with auth and tests'],['Debug my code','paste an error or a broken function'],['Design a system architecture','for a scalable web or mobile app'],['Make a modern UI','React, Tailwind or plain HTML/CSS']];
function render(){
 const c=chats.find(x=>x.id===cur),w=$('wrap');
 if(!c||!c.m.length)w.innerHTML=`<div class="hero"><div class="mark" style="margin:auto;width:52px;height:52px;font-size:22px;border-radius:15px">Dv</div><h1>What are we building?</h1><p>Any language. Any stack. Unlimited code prompts.</p><div class="sugs">${SUG.map((s,i)=>`<div class="sug" onclick="ask(SUG[${i}].join(' '))">${s[0]}<small>${s[1]}</small></div>`).join('')}</div></div>`;
 else{w.innerHTML=c.m.map(m=>m.r==='user'?`<div class="m me"><div class="body">${esc(m.t).replace(/\n/g,'<br>')}</div></div>`:`<div class="m"><div class="av">Dv</div><div class="body">${m.t?md(m.t):'<span class="dots">Thinking…</span>'}</div></div>`).join('');
  if(!busy&&c.m.length&&c.m[c.m.length-1].r==='assistant')w.innerHTML+='<div class="more"><button class="icon" onclick="ask(\'Continue exactly where you left off. Do not repeat anything.\')">Continue ∞</button></div>'}
 $('list').innerHTML=chats.map(x=>`<div class="chat ${x.id===cur?'on':''}" onclick="cur='${x.id}';render()"><span>${esc(x.title)}</span><b onclick="event.stopPropagation();del('${x.id}')">✕</b></div>`).join('');
 $('inf').classList.toggle('on',S.inf);$('msgs').scrollTop=$('msgs').scrollHeight}
function del(id){chats=chats.filter(x=>x.id!==id);if(cur===id)cur=null;save();render()}
const SYS={code:'You are Devo, an expert software engineer fluent in every language and framework. Write idiomatic, production-quality code, handle edge cases, and debug methodically.',design:'You are Devo, a senior software and UI/UX architect. Focus on system design, patterns, trade-offs and clean interfaces, with concrete code sketches.',review:'You are Devo, a meticulous code reviewer. Find bugs, security, performance and design problems, then give refactored code.'};
async function loadPrompt(){try{const r=await fetch('prompt.txt?'+Date.now(),{cache:'no-store'});PROMPT=r.ok?(await r.text()).trim():''}catch(e){}}
function sysPrompt(){let s=SYS[S.focus]+' Be concise but thorough. Put code in fenced blocks with a language tag.';
 if(PROMPT&&PROMPT!=='put anything you want the ai to follow here')s+='\n\nProject instructions from prompt.txt (follow strictly):\n'+PROMPT;return s}
// One streamed request. Returns true if the reply was cut off by the length limit.
async function stream(msgs,onText){
 let url,headers={'Content-Type':'application/json'},body;
 if(S.prov==='anthropic'){url='https://api.anthropic.com/v1/messages';Object.assign(headers,{'x-api-key':S.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'});
  body={model:S.model,max_tokens:4096,system:sysPrompt(),messages:msgs,stream:true}}
 else{url=S.base.replace(/\/$/,'')+'/chat/completions';headers.Authorization='Bearer '+S.key;
  body={model:S.model,messages:[{role:'system',content:sysPrompt()},...msgs],stream:true}}
 const r=await fetch(url,{method:'POST',headers,body:JSON.stringify(body)});
 if(!r.ok){let t=await r.text();try{t=JSON.parse(t).error.message||t}catch(e){}throw new Error(r.status+': '+t)}
 const rd=r.body.getReader(),dec=new TextDecoder();let buf='',cut=false;
 while(true){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
  const lines=buf.split('\n');buf=lines.pop();
  for(const l of lines){if(!l.startsWith('data:'))continue;const d=l.slice(5).trim();if(!d||d==='[DONE]')continue;
   try{const j=JSON.parse(d);
    if(S.prov==='anthropic'){if(j.type==='content_block_delta'&&j.delta.text)onText(j.delta.text);if(j.type==='message_delta'&&j.delta.stop_reason==='max_tokens')cut=true}
    else{const ch=j.choices&&j.choices[0];if(ch){if(ch.delta&&ch.delta.content)onText(ch.delta.content);if(ch.finish_reason==='length')cut=true}}}catch(e){}}}
 return cut}
async function ask(text){
 text=(text||'').trim();if(!text||busy)return;
 if(!S.key){$('modal').classList.add('on');return}
 let c=chats.find(x=>x.id===cur);
 if(!c){c={id:'c'+Date.now(),title:text.slice(0,32),m:[]};chats.unshift(c);cur=c.id}
 c.m.push({r:'user',t:text});const a={r:'assistant',t:''};c.m.push(a);$('inp').value='';$('inp').style.height='auto';busy=true;render();
 await loadPrompt();
 const base=c.m.slice(0,-1).map(m=>({role:m.r,content:m.t}));
 try{let part=0,cut;
  do{const msgs=part?[...base,{role:'assistant',content:a.t.trimEnd()},{role:'user',content:'Continue exactly where you stopped. Do not repeat anything.'}]:base;
   cut=await stream(msgs,d=>{a.t+=d;render()});part++}
  while(cut&&S.inf&&part<40)}
 catch(e){a.t+=(a.t?'\n\n':'')+'**Error:** '+e.message+(/Failed to fetch/.test(e.message)?' (check your API key, model name and provider in Settings)':'')}
 busy=false;save();render()}
$('send').onclick=()=>ask($('inp').value);
$('inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask($('inp').value)}});
$('inp').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'});
$('newBtn').onclick=()=>{cur=null;render()};
$('inf').onclick=()=>{S.inf=!S.inf;save();render()};
$('pfile').onclick=async()=>{await loadPrompt();$('pText').value=PROMPT||'(prompt.txt not found next to index.html)';$('pmodal').classList.add('on')};
$('pClose').onclick=()=>$('pmodal').classList.remove('on');
$('setBtn').onclick=()=>$('modal').classList.add('on');
function theme(){S.theme==='auto'?document.documentElement.removeAttribute('data-theme'):document.documentElement.setAttribute('data-theme',S.theme)}
function baseRow(){$('baseRow').style.display=$('prov').value==='openai'?'block':'none'}
$('prov').onchange=()=>{const o=$('prov').value==='openai';$('model').value=o?'gpt-4o':'claude-sonnet-5-5';baseRow()};
$('close').onclick=()=>{Object.assign(S,{prov:$('prov').value,key:$('key').value.trim(),model:$('model').value.trim(),base:$('base').value.trim(),focus:$('focus').value,theme:$('theme').value});theme();save();$('modal').classList.remove('on')};
['prov','key','model','base','focus','theme'].forEach(k=>$(k).value=S[k]);baseRow();theme();loadPrompt();render();
</script></body></html>
